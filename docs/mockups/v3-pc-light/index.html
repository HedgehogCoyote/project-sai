</style><body><div id="root"></div><script>const pages=["<div class=\"sheet s1 auth\"><div class=\"reviewbar\"><b>01 / 32 &nbsp; 로그인</b><span>SAI · PC 낮 테마 · 화면/동작 검토용</span></div><div class=\"layout\"><main class=\"workspace\"><div class=\"content\"><div class=\"authbrand\"><span class=\"word\">SAI<span>●</span></span><h1>함께하는 일들을,<br>한 공간에.</h1><p>나의 기록부터 친구들과의 여행까지.</p></div><div class=\"authform\"><h2>다시 만나 반가워요</h2><label class=\"field\">아이디 <b class=\"mark\">1</b><input value=\"sai_user\" type=\"text\"></label><label class=\"field\">비밀번호 <b class=\"mark\">2</b><input value=\"example123!\" type=\"password\"></label><div class=\"buttons\"><a class=\"button primary\" href=\"?screen=03\">로그인<b class=\"mark\">3</b></a><a class=\"button \" href=\"?screen=02\">회원가입<b class=\"mark\">4</b></a></div></div></div></main><aside class=\"notes\"><h3>이 화면의 동작</h3><p class=\"lead\">번호는 동작 설명을 위한 표시입니다.<br>실제 제품에서는 표시하지 않습니다.</p><div class=\"note\"><strong><b class=\"mark\">1</b>아이디</strong><p>아이디를 입력합니다. 빈 값이면 로그인할 수 없습니다.</p></div><div class=\"note\"><strong><b class=\"mark\">2</b>비밀번호</strong><p>비밀번호를 입력합니다. 실제 로그인은 기존 인증 API에 연결합니다.</p></div><div class=\"note\"><strong><b class=\"mark\">3</b>로그인</strong><p>입력을 확인하고 로그인 성공 시 내 공간으로 이동합니다. 실패하면 같은 화면에 오류를 표시합니다.</p><div class=\"dest\">→ 03번 화면</div></div><div class=\"note\"><strong><b class=\"mark\">4</b>회원가입</strong><p>회원가입 화면으로 이동합니다.</p><div class=\"dest\">→ 02번 화면</div></div></aside></div><div class=\"foot\"><span>정적 목업 · 가상 데이터 · 입력/저장/초대의 실제 API 호출 없음</span><span>White / Black / Deep Purple · v3</span></div></div>", "<div class=\"sheet s2 auth\"><div class=\"reviewbar\"><b>02 / 32 &nbsp; 회원가입</b><span>SAI · PC 낮 테마 · 화면/동작 검토용</span></div><div class=\"layout\"><main class=\"workspace\"><div class=\"content\"><div class=\"authbrand\"><span class=\"word\">SAI<span>●</span></span><h1>나만의 공간을<br>시작하세요.</h1><p>이미 계정이 있다면 로그인하세요.</p></div><div class=\"authform\"><h2>회원가입</h2><div class=\"grid\"><label class=\"field\">이름 <b class=\"mark\">1</b><input value=\"지민\" type=\"text\"></label><label class=\"field\">아이디 <b class=\"mark\">2</b><input value=\"sai_user\" type=\"text\"></label></div><div class=\"grid\"><label class=\"field\">비밀번호 <b class=\"mark\">3</b><input value=\"example123!\" type=\"password\"></label><label class=\"field\">비밀번호 확인 <b class=\"mark\">4</b><input value=\"example123!\" type=\"password\"></label></div><label class=\"field\">이메일 <b class=\"mark\">5</b><input value=\"jimin@example.test\" type=\"text\"></label><label class=\"field\">전화번호 <b class=\"mark\">6</b><input value=\"010-0000-0000\" type=\"text\"></label><div class=\"buttons\"><a class=\"button primary\" href=\"?screen=01\">가입하기<b class=\"mark\">7</b></a><a class=\"button \" href=\"?screen=01\">로그인으로<b class=\"mark\">8</b></a></div></div></div></main><aside class=\"notes\"><h3>이 화면의 동작</h3><p class=\"lead\">번호는 동작 설명을 위한 표시입니다.<br>실제 제품에서는 표시하지 않습니다.</p><div class=\"note\"><strong><b class=\"mark\">1</b>이름</strong><p>이름을 입력합니다.</p></div><div class=\"note\"><strong><b class=\"mark\">2</b>아이디</strong><p>가입 시 서버에서 중복을 검사합니다.</p></div><div class=\"note\"><strong><b class=\"mark\">3</b>비밀번호</strong><p>서버 비밀번호 정책을 충족해야 합니다.</p></div><div class=\"note\"><strong><b class=\"mark\">4</b>비밀번호 확인</strong><p>두 비밀번호가 일치해야 합니다.</p></div><div class=\"note\"><strong><b class=\"mark\">5</b>이메일</strong><p>이메일 형식을 검사합니다. 샘플 주소입니다.</p></div><div class=\"note\"><strong><b class=\"mark\">6</b>전화번호</strong><p>기존 가입 API의 입력 항목입니다. 샘플 번호입니다.</p></div><div class=\"note\"><strong><b class=\"mark\">7</b>가입하기</strong><p>필수 항목 확인 후 가입하고 로그인 화면으로 이동합니다. 중복 아이디 오류는 입력란 아래에 표시합니다.</p><div class=\"dest\">→ 01번 화면</div></div><div class=\"note\"><strong><b class=\"mark\">8</b>로그인으로</strong><p>입력을 취소하고 로그인으로 돌아갑니다.</p><div class=\"dest\">→ 01번 화면</div></div></aside></div><div class=\"foot\"><span>정적 목업 · 가상 데이터 · 입력/저장/초대의 실제 API 호출 없음</span><span>White / Black / Deep Purple · v3</span></div></div>", "<div class=\"sheet s3 \"><div class=\"reviewbar
